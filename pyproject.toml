[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lensrag-bragslabs-experiment"
version = "0.1.0"
description = "Reproducible corpus-level RAG evaluation on BragsLabs HR corpus"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7", "tiktoken>=0.5"]

[project.scripts]
lensrag = "lensrag.cli:main"

[tool.setuptools.packages.find]
include = ["lensrag*"]
